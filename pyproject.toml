[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-studio-engine"
version = "0.1.0"
description = "SAM Studio segmentation engine (Meta AI Hackathon, Oct 26-Nov 4 2026): provider contract, fake provider, Meta Model API provider (SAM 3.1), job service with /sam routes."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=1.26",
    "meta-sam-parser>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
